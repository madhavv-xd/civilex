[project]
name = "ai-civ-sim-backend"
version = "0.1.0"
description = "AI Civilization Simulator — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "motor>=3.4.0",
    "beanie>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.28.0",
    "sse-starlette>=2.1.0",
    "pymongo>=4.6.0",
    "dnspython>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"